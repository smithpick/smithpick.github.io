<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Practice</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:"Work Sans", Arial, Helvetica, sans-serif; color:#222;
         background:linear-gradient(#7fc6f2 0%, #a9dcf7 55%, #d3effc 100%);
         display:flex; align-items:center; justify-content:center; padding:16px; overflow:hidden; position:relative; }
  /* clouds */
  .cloud { position:absolute; background:linear-gradient(#ffffff, rgba(255,255,255,.4)); border-radius:999px; opacity:.85; }
  .cloud::before, .cloud::after { content:""; position:absolute; background:inherit; border-radius:50%; }
  .cloud::before { width:55%; height:140%; left:15%; bottom:30%; }
  .cloud::after  { width:45%; height:120%; right:12%; bottom:30%; }
  .c1 { width:60px;  height:22px; top:30px;  left:34%; }
  .c2 { width:60px;  height:22px; top:45px;  left:65%; }
  .c3 { width:120px; height:50px; top:140px; right:-30px; }
  .c4 { width:110px; height:45px; top:345px; left:18%; }
  .c5 { width:210px; height:110px; top:430px; right:6%; }
  .c6 { width:230px; height:110px; top:470px; left:17%; }
  .c7 { width:260px; height:120px; top:480px; left:45%; }

  .card { position:relative; z-index:2; width:100%; max-width:540px; background:rgba(245,250,253,.95);
          border-top:6px solid #7b5ba6; border-radius:4px; padding:10px 16px 46px; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .who { display:flex; align-items:center; gap:8px; font-weight:bold; font-size:18px; }
  .badge { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .b1 { background:#6b4f9a; }
  .b2 { background:#ffcc00; width:42px; height:42px; }
  .code { display:flex; align-items:center; gap:6px; font-weight:bold; font-size:18px; color:#666; }
  .label { margin:34px 0 8px; font-size:16px; }
  .field-wrap { position:relative; }
  .field { display:flex; align-items:center; gap:6px; background:#fff; border:1px solid #e3e3e3; border-radius:999px;
           padding:4px 8px; cursor:text; }
  .field.focus { border-color:#7b5ba6; }
  .field.filled { background:#e8f0fe; }
  .face { width:28px; height:28px; flex:0 0 auto; }
  .field input { flex:1; border:none; outline:none; background:transparent; font-size:16px; color:#333;
                 padding:6px 0; font-family:inherit; }
  .field input::placeholder { color:#444; }
  /* Chrome-style autofill popup */
  .autofill { position:absolute; left:0; width:280px; top:calc(100% + 2px); background:#fff; border-radius:8px;
              box-shadow:0 2px 8px rgba(0,0,0,.3); display:none; z-index:5; overflow:hidden; }
  .autofill.show { display:block; }
  .opt { display:flex; align-items:center; gap:12px; padding:10px 14px; cursor:pointer; font-size:16px; }
  .opt:hover { background:#e8f0fe; }
  .manage { border-top:1px solid #e5e7eb; padding:8px 14px; font-size:13px; color:#5f6368; }
  .login { margin-top:34px; width:100%; font-size:16px; padding:9px; border:none; border-radius:999px;
           background:#c4bcd9; color:#fff; cursor:default; font-family:inherit; }
  .login.ready { background:#7b5ba6; cursor:pointer; }
  .done { display:none; text-align:center; padding:30px 0 0; }
  .done h1 { font-size:40px; margin:10px 0; color:#7b5ba6; }
  .again { margin-top:14px; font-size:16px; background:none; border:2px solid #7b5ba6; color:#7b5ba6;
           border-radius:999px; padding:8px 26px; cursor:pointer; }
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div>
<div class="cloud c5"></div><div class="cloud c6"></div><div class="cloud c7"></div>

<div class="card">
  <div class="top">
    <div class="who"><div class="badge b1">&#128214;</div>Student</div>
    <div class="code"><div class="badge b2">&#11088;</div>00000000</div>
  </div>

  <div id="loginView">
    <div class="label">Please enter player name</div>
    <div class="field-wrap">
      <div class="field" id="field">
        <svg class="face" viewBox="0 0 28 28" aria-hidden="true">
          <circle cx="14" cy="14" r="14" fill="#a985d6"/>
          <circle cx="9.5" cy="11" r="3.6" fill="#fff"/><circle cx="18.5" cy="11" r="3.6" fill="#fff"/>
          <circle cx="10" cy="11.5" r="1.7" fill="#222"/><circle cx="18" cy="11.5" r="1.7" fill="#222"/>
          <path d="M8 17 Q14 24 20 17 Z" fill="#222"/>
          <rect x="11" y="17" width="2" height="2" fill="#fff"/><rect x="15" y="17" width="2" height="2" fill="#fff"/>
        </svg>
        <input id="nameInput" placeholder="Player name" autocomplete="off" spellcheck="false">
      </div>
      <div class="autofill" id="popup">
        <div class="opt" id="opt">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#5f6368" aria-hidden="true">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
          <span>Matt</span>
        </div>
        <div class="manage">Manage...</div>
      </div>
    </div>
    <button class="login" id="login">Login</button>
  </div>

  <div class="done" id="doneView">
    <div style="font-size:70px">&#11088;</div>
    <h1 id="doneText">Great job!</h1>
    <button class="again" id="again">Try again</button>
  </div>
</div>

<script>
(function(){
  const field = document.getElementById('field');
  const input = document.getElementById('nameInput');
  const popup = document.getElementById('popup');
  const login = document.getElementById('login');

  function update() { login.classList.toggle('ready', input.value.trim() !== ''); }

  field.addEventListener('click', e => {
    e.stopPropagation(); field.classList.add('focus'); input.focus();
    if (input.value === '') popup.classList.add('show');
  });
  document.getElementById('opt').addEventListener('click', e => {
    e.stopPropagation();
    input.value = 'Matt';
    field.classList.add('filled'); popup.classList.remove('show');
    input.focus(); input.setSelectionRange(input.value.length, input.value.length);
    update();
  });
  input.addEventListener('input', () => { popup.classList.remove('show'); update(); });
  document.addEventListener('click', () => { popup.classList.remove('show'); field.classList.remove('focus'); });

  login.addEventListener('click', () => {
    if (input.value.trim() === '') return;
    document.getElementById('doneText').textContent = 'Great job, ' + input.value.trim() + '!';
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('doneView').style.display = 'block';
  });
  document.getElementById('again').addEventListener('click', () => {
    input.value = ''; field.classList.remove('filled'); update();
    document.getElementById('doneView').style.display = 'none';
    document.getElementById('loginView').style.display = 'block';
  });
})();
</script>
</body>
</html>
